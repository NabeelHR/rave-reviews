services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rr
      POSTGRES_PASSWORD: rr
      POSTGRES_DB: ravereviews
    ports:
      - "5432:5432"
    volumes:
      - rr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rr -d ravereviews"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  rr_pgdata:
